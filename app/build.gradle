plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fhwl.signhook'
    compileSdk 33

    defaultConfig {
        applicationId "com.fhwl.signhook"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
